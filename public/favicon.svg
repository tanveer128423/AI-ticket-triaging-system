<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2a36"/>
      <stop offset="1" stop-color="#11181f"/>
    </linearGradient>
    <linearGradient id="ticket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7dcb6"/>
      <stop offset="1" stop-color="#d8c89e"/>
    </linearGradient>
  </defs>

  <!-- rounded app background -->
  <rect x="0" y="0" width="64" height="64" rx="15" fill="url(#bg)"/>

  <!-- ticket body with perforated notch -->
  <path fill="url(#ticket)" d="
    M16 18
    h22
    a4 4 0 0 1 4 4
    v6
    a4 4 0 0 0 0 8
    v6
    a4 4 0 0 1 -4 4
    h-22
    a4 4 0 0 1 -4 -4
    v-6
    a4 4 0 0 0 0 -8
    v-6
    a4 4 0 0 1 4 -4
    z"/>

  <!-- dashed perforation line -->
  <line x1="42" y1="20" x2="42" y2="44" stroke="#11181f" stroke-width="1.6"
        stroke-dasharray="2 3" stroke-linecap="round" opacity="0.55"/>

  <!-- triage priority lines -->
  <rect x="17" y="25" width="16" height="2.6" rx="1.3" fill="#11181f" opacity="0.5"/>
  <rect x="17" y="30.7" width="11" height="2.6" rx="1.3" fill="#11181f" opacity="0.35"/>

  <!-- sage-green routed checkmark badge -->
  <circle cx="44.5" cy="42.5" r="11" fill="#6c8a71" stroke="#11181f" stroke-width="2"/>
  <path d="M39.5 42.8 l3.3 3.3 l6.3 -6.8" fill="none" stroke="#f4f6f2"
        stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
